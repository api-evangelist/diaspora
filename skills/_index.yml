cross_cutting_rules:
- >-
  There is no single API host. A pod must be chosen before anything else, and credentials are
  per-pod.
- >-
  The openid scope is mandatory; public:read is always granted; private:read and private:modify
  require contacts:read.
- >-
  No idempotency mechanism exists. Interaction endpoints signal already-applied state with 409 on
  create and 410 on delete — treat both as convergence, not failure.
- >-
  Never construct pagination URLs. Follow the Link header; some resources page by timestamp or
  GUID.
- >-
  Errors are a bespoke {code, message} envelope, not RFC 9457. Branch on status code plus
  operation, never on message text.
- >-
  404 can mean "not visible to you" rather than "does not exist", because visibility is governed
  by aspects and federation reach.

