description: >-
  The diaspora* project publishes first-party libraries, but they are federation-protocol and
  content-rendering libraries used to build and interoperate with diaspora* pods — not client SDKs
  for the /api/v1 REST API. As of this pass the project ships NO official client SDK for its own
  HTTP API in any language: the API documentation directs implementers to standard OpenID Connect
  libraries and plain HTTP. That is an honest gap, not an omission in this file.

