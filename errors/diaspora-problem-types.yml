method: searched
source: >-
  https://diaspora.github.io/api-documentation/errors.html for the global response-code list and
  the error envelope, enriched with the per-operation error tables published on the individual
  route pages under https://diaspora.github.io/api-documentation/routes/. Cross-checked against
  the responses captured in openapi/diaspora-api-openapi.yml.
docs: https://diaspora.github.io/api-documentation/errors.html
description: >-
  The diaspora* API returns an HTTP status code alongside a JSON body describing the error. It
  does NOT use RFC 9457 problem+json — the envelope is a bespoke two-field object, and errors are
  distinguished by status code and message rather than by a stable machine-readable type or code
  string. Clients should therefore branch on HTTP status plus the operation they called, not on
  the message text.

format: custom-json
rfc9457: false
content_type: application/json
envelope:
  fields:
  - name: code
    type: integer
    description: The HTTP status code, repeated in the body.
  - name: message
    type: string
    description: Human readable description of the error.
  example:
    code: 404
    message: Requested entity wasn't found
  stable_error_identifier: false
  note: >-
    There is no machine-readable error type, slug or sub-code. The message string is the only
    discriminator beyond the status code, and it is not documented as stable.

status_codes:
- status: 400
  title: Wrong request parameter
  meaning: A supplied parameter was invalid.
  remediation: Check parameter names, types and value ranges against the route documentation.
- status: 401
  title: The API request requires authorization
  meaning: >-
    No access token was supplied, or the supplied token is invalid. All API endpoints require
    authentication.
  remediation: >-
    Obtain an access token via OpenID Connect against the target pod, and send it as an
    Authorization Bearer header.
  see: authentication/diaspora-authentication.yml
- status: 403
  title: Unauthorized
  meaning: >-
    The access token is valid but was not granted the OAuth scope the endpoint requires, or the
    user is not permitted to perform the action on this resource. The response body is empty in
    the insufficient-scope case.
  remediation: >-
    Re-request authorization including the scope documented for the endpoint. Remember that
    granted scopes may differ from requested scopes, and that private:read/private:modify can only
    be granted alongside contacts:read.
  see: scopes/diaspora-scopes.yml
- status: 404
  title: Requested entity wasn't found
  meaning: The addressed entity does not exist, or is not visible to this user.
  remediation: Verify the GUID or id. Note that visibility rules can render an existing entity absent.
- status: 409
  title: Entity already exists
  meaning: >-
    The action has already been performed — the like, reshare, block, tag following, report or
    subscription already exists.
  remediation: Treat as success-equivalent when the goal is convergence to the desired state.
- status: 410
  title: Entity no longer exists / was never present
  meaning: >-
    Used on removal endpoints when the thing being removed is not there — the like doesn't exist,
    the tag was not followed, the block doesn't exist, the post was not subscribed to or is not
    hidden. Also returned when a comment is not found for the given post.
  remediation: Treat as success-equivalent when the goal is convergence to the desired state.
  note: >-
    410 is not listed in the global error table but is used consistently across the interaction
    routes.
- status: 422
  title: Validation errors
  meaning: >-
    The request was well-formed but could not be accepted — a missing report reason, a user not
    allowed to comment, like or reshare, an unprocessable conversation or comment, or a wrong id
    in a poll vote.
  remediation: Inspect the message and correct the request body.

