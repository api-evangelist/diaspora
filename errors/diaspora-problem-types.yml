client_guidance:
- >-
  Treat 409 on a create-interaction call and 410 on the matching delete call as convergence, not
  failure — both mean the desired end state already holds.
- >-
  Do not parse message strings. Branch on status code plus the operation invoked.
- >-
  Distinguish 401 (no/invalid token) from 403 (valid token, missing scope or forbidden action);
  only the former should trigger a re-authentication.
- >-
  404 can mean "not visible to you" rather than "does not exist", because visibility is scoped by
  aspects and federation.

