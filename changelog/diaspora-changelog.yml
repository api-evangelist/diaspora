- version: 0.9.1.0
  date: '2026-04-07'
  breaking: false
  api_relevant: true
  highlights:
  - type: security
    summary: >-
      Fixed a vulnerability in the OpenID Connect API implementation where an attacker could use
      malicious client registrations to trigger HTTP requests within the pod's private network.
    api_impact: >-
      Directly affects the Dynamic Client Registration endpoint that the diaspora* API depends on
      for third-party application onboarding.
  - type: fix
    summary: Handled minimagick errors when uploading photos to the API.
    ref: https://github.com/diaspora/diaspora/pull/8469
    api_impact: Affects the photo upload operation (createPhotos).
  - type: refactor
    summary: Improved compatibility with non-specification-compliant OpenGraph metadata.
    ref: https://github.com/diaspora/diaspora/pull/8465
    api_impact: Affects the open_graph_object embedded in post responses.
  - type: fix
    summary: Fixed a bug with parsing certain OpenGraph metadata structures.
    ref: https://github.com/diaspora/diaspora/pull/8463
  - type: feature
    summary: Notifications are now marked as read when you block a person.
    ref: https://github.com/diaspora/diaspora/pull/8456
    api_impact: Changes observable state returned by the notifications endpoints.
  - type: feature
    summary: For admins, the offending content's author is now visible in the reports overview.
    ref: https://github.com/diaspora/diaspora/pull/8464

- version: 0.9.0.0
  date: '2024-06-16'
  breaking: true
  api_relevant: true
  landmark: true
  breaking_detail: >-
    Configuration moved to TOML (YAML deprecated for removal in 1.0); the appserver changed from
    unicorn to puma with mandatory configuration changes; single_process_mode and
    embed_sidekiq_worker were removed; the listen configuration format changed; the PORT env var
    and -p flag were removed; XMPP chat integration, relay support and the old federation protocol
    were removed.
  highlights:
  - type: feature
    summary: >-
      The diaspora* API became officially supported — "With the release of diaspora* Version 0.9,
      we now officially support building applications on top of the diaspora* API!"
    api_impact: >-
      This is the release that makes /api/v1 a supported integration surface. It is the effective
      birth date of the API for consumers.
    ref: https://diaspora.github.io/api-documentation/
  - type: security
    summary: Fixed a potential 2FA brute force attack (CVE-2024-0227).
    cve: CVE-2024-0227
    credit: >-
      Christian Reitter (Radically Open Security) and Chris MacNaughton (Centauri Solutions).
  - type: breaking
    summary: >-
      Configuration switched to TOML. The YAML configuration file will no longer be read as of
      release 1.0.
  - type: breaking
    summary: Replaced unicorn with puma as the application server.
    ref: https://github.com/diaspora/diaspora/pull/8392
  - type: breaking
    summary: Removed the XMPP chat integration (JSXC/Prosody).
    ref: https://github.com/diaspora/diaspora/pull/8069
  - type: refactor
    summary: >-
      Upgraded to the latest diaspora_federation and removed support for the old federation
      protocol.
    ref: https://github.com/diaspora/diaspora/pull/8368
  - type: refactor
    summary: Enabled the Content-Security-Policy header by default.
    ref: https://github.com/diaspora/diaspora/pull/7781
  - type: refactor
    summary: Added CORS headers to nodeinfo endpoints to allow client-side fetching.
    ref: https://github.com/diaspora/diaspora/pull/8436
    api_impact: >-
      Makes browser-based version discovery possible, which the API documentation requires before
      making requests.
  - type: fix
    summary: Updated the search endpoint to be aware of ignored users.
    ref: https://github.com/diaspora/diaspora/pull/8363
    api_impact: Affects the search operations.
  - type: feature
    summary: Added backend for archive import.
  - type: refactor
    summary: Added Ruby 3 support; suggested Ruby version is now 3.3.

- version: 0.7.18.2
  date: '2023-07-10'
  breaking: false
  highlights:
  - type: maintenance
    summary: Final maintenance release of the 0.7 series.

