docs: https://github.com/diaspora/diaspora/blob/develop/Changelog.md
description: >-
  diaspora* keeps a hand-written changelog in the source repository, organized by product release
  and grouped into Security / Refactor / Bug fixes / Features headings, with every line linking to
  the pull request or issue that made the change. There is no separate API changelog — API changes
  appear inline with product changes, so an API consumer has to read the product changelog to
  track them. Only the recent window is captured here.

scheme:
