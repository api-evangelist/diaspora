  location: repository root (Changelog.md)
  organized_by: release
  standard_sections:
  - Security
  - Refactor
  - Bug fixes
  - Features
  entry_linking: Each line links to the originating GitHub pull request or issue.
  api_specific_changelog: false
  dated_in_file: false
  note: >-
    The changelog file itself is not dated; release dates below come from the GitHub releases API.
    An "unreleased" section at the top accumulates changes on the develop branch.

