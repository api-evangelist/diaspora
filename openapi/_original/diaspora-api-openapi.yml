openapi: 3.1.0
info:
  title: diaspora* API
  version: '1'
  description: 'The diaspora* API (version 1) as published in the official diaspora* API documentation.
    diaspora* is a decentralized social network, so there is no single API host: every pod exposes the
    same API under its own domain at /api/v1. Version discovery should be performed with nodeinfo before
    making requests. Authentication is OpenID Connect Core 1.0 with Dynamic Client Registration, because
    a manual application registration on a single pod is not sufficient. Only JSON is supported. NOTE:
    upstream marks this API as not yet stable pending the diaspora* 0.8.0.0 release.'
  contact:
    name: diaspora* project
    url: https://diasporafoundation.org/
  license:
    name: AGPL-3.0
    url: https://github.com/diaspora/diaspora/blob/develop/COPYRIGHT
externalDocs:
  description: diaspora* API documentation
  url: https://diaspora.github.io/api-documentation/
servers:
- url: https://{pod}/api/v1
  description: Any diaspora* pod running a compatible release. Discover support via nodeinfo at https://{pod}/.well-known/nodeinfo.
  variables:
    pod:
      default: diaspora.social
      description: Hostname of the diaspora* pod to talk to.
tags:
- name: Aspects
- name: Comments
- name: Contacts
- name: Conversations
- name: Likes
- name: Notifications
- name: Photos
- name: Post interactions
- name: Posts
- name: Reshares
- name: Search
- name: Streams
- name: Tag followings
- name: Users
paths:
  /aspects:
    get:
      operationId: getAspects
      summary: Get lists of aspects
      tags:
      - Aspects
      description: 'Required API scope: contacts:read'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: The API request requires authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - openIdConnect:
        - openid
        - contacts:read
    post:
      operationId: createAspects
      summary: Create new aspect
      tags:
      - Aspects
      description: 'Required API scope: contacts:modify'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: The API request requires authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - openIdConnect:
        - openid
        - contacts:modify
  /aspects/{aspect_id}:
    get:
      operationId: getAspectsByAspectId
      summary: Get information about an aspect
      tags:
      - Aspects
      description: 'Required API scope: contacts:read'
      parameters:
      - name: aspect_id
        in: path
        required: true
        description: ID of the aspect.
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: The API request requires authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - openIdConnect:
        - openid
        - contacts:read
    patch:
      operationId: updateAspectsByAspectId
      summary: Edit an aspect
      tags:
      - Aspects
      description: 'Required API scope: contacts:modify'
      parameters:
      - name: aspect_id
        in: path
        required: true
        description: ID of the aspect.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The aspects name.
                order:
                  type: integer
                  description: The aspects position in the aspect list. If provided, the aspect will get
                    inserted into the given position and other aspects will be reordered.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: The API request requires authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - openIdConnect:
        - openid
        - contacts:modify
    delete:
      operationId: deleteAspectsByAspectId
      summary: Delete an aspect
      tags:
      - Aspects
      description: 'Required API scope: contacts:modify'
      parameters:
      - name: aspect_id
        in: path
        required: true
        description: ID of the aspect.
        schema:
          type: integer
      responses:
        '204':
          description: No Content
        '401':
          description: The API request requires authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - openIdConnect:
        - openid
        - contacts:modify
