  /posts:
    post:
      operationId: createPosts
      summary: Publish a post
      tags:
      - Posts
      description: 'Required API scope: public:modify or private:modify depending on the post visibility'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aspects:
                  type: array
                  description: Array of aspect IDs to share this post with.
                  items: {}
                body:
                  type: string
                  description: A markdown formatted body with optional mentions.
                location:
                  type: object
                  description: See above.
                photos:
                  type: array
                  description: Array of GUIDs from pending photos that should be attached to a post. (See
                    the Photos documentation)
                  items: {}
                poll:
                  type: object
                  description: See above.
                public:
                  type: boolean
                  description: Whether the post should be public or not.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
