      security:
      - openIdConnect:
        - openid
        - contacts:modify
  /aspects/{aspect_id}/contacts/{person_guid}:
    delete:
      operationId: deleteAspectsByAspectIdContactsByPersonGuid
      summary: Remove a user from an aspect
      tags:
      - Contacts
      description: 'Required API scope: contacts:modify'
      parameters:
      - name: aspect_id
        in: path
        required: true
        description: ID of the aspect.
        schema:
          type: integer
      - name: person_guid
        in: path
        required: true
        description: GUID of the person.
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: The API request requires authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - openIdConnect:
        - openid
        - contacts:modify
