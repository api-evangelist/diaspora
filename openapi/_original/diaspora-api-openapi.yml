        - public:modify
        - private:modify
  /posts/{post_guid}/comments:
    get:
      operationId: getPostsByPostGuidComments
      summary: Get comments for a post
      tags:
      - Comments
      description: 'Required API scope: the one which gives read access to the post (public:read for public
