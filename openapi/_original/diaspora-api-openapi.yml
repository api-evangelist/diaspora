components:
  securitySchemes:
    openIdConnect:
      type: openIdConnect
      description: OpenID Connect Core 1.0 (Authorization Code Flow or Implicit Flow) with Dynamic Client
        Registration 1.0. The openid scope is mandatory; public:read is always granted.
      openIdConnectUrl: https://diaspora.social/.well-known/openid-configuration
  schemas:
    Error:
      type: object
      description: Error envelope returned by the diaspora* API.
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 404
        message:
          type: string
          description: Human readable error message.
          example: Requested entity wasn't found
